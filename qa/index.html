<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Muck Frog Q&amp;A</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#071207;color:#e8f5e8;padding:1rem}
    .card{background:#072a07;padding:1rem;border-radius:8px;border:1px solid #2b7a2b;max-width:900px;margin:0 auto;position:relative}
    .login-top{position:absolute;top:12px;right:12px}
    .btn{background:#FFD700;color:#071207;padding:0.5rem 0.8rem;border-radius:6px;text-decoration:none;font-weight:bold}
    input,textarea{width:100%;padding:0.5rem;margin:0.4rem 0;border-radius:6px;border:1px solid #214021;background:#0b1b0b;color:#eaf6ea}
    .q{border-bottom:1px dashed #214021;padding:0.6rem 0}
    .answer-form{margin-top:0.5rem}
    .meta{font-size:0.85rem;color:#9fd29f}
  </style>
  <script defer src="js/main.js"></script>
</head>
<body>
  <div class="card">
    <div id="protocolWarning" style="display:none;background:#3a1f1f;padding:0.75rem;border-radius:6px;margin-bottom:0.75rem;color:#ffdede;">Warning: this page was opened directly from disk. The Q&amp;A requires the server. Run <code>node server.js</code> and open <a href="http://localhost:3000/qa/">http://localhost:3000/qa/</a> instead.</div>
    <a href="login.html" class="btn login-top">Login</a>
    <h1>Muck Frog — Q&amp;A</h1>
    <p>You can ask questions publicly without an account. To answer questions, login via the admin page.</p>

    <h2>Ask a question</h2>
    <form id="askForm">
      <input id="askName" placeholder="Your name (optional)">
      <textarea id="askQuestion" rows="4" placeholder="Your question"></textarea>
      <button class="btn" id="askBtn">Ask</button>
      <p id="askMsg"></p>
    </form>

    <h2>Questions</h2>
    <div id="questions"></div>
  </div>
  <script>
    // Show a clear warning when the page is opened via file:// (users often do this)
    (function(){
      try{
        if(location.protocol === 'file:'){
          var w = document.getElementById('protocolWarning');
          if(w) w.style.display = 'block';
        }
      }catch(e){/* ignore */}
    })();
  </script>
</body>
</html>
