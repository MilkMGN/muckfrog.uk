<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muck Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a3a1a 0%, #0f2010 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            color: #FFD700;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            font-size: 2.5rem;
        }

        .game-info {
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: #90EE90;
        }

        #gameCanvas {
            border: 4px solid #FFD700;
            background-color: #0f2010;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .controls {
            margin-top: 2rem;
            color: #90EE90;
            font-size: 1.1rem;
        }

        .controls p {
            margin: 0.5rem 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background: rgba(26, 58, 26, 0.8);
            border: 2px solid #FFD700;
            color: #FFD700;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(26, 58, 26, 1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐸 Muck Snake Game 🐸</h1>
        <div class="game-info">
            Score: <span id="score">0</span> | High Score: <span id="highScore">0</span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <p>🎮 Use Arrow Keys or WASD to move</p>
            <p>🍽️ Eat the muck to grow!</p>
            <p>Space to pause/resume</p>
            <p id="gameOver" style="color: #FFD700; margin-top: 1rem; display: none; font-size: 1.5rem;"></p>
        </div>
        <a href="index.html" class="back-link">← Back to the Roast</a>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const gameOverDisplay = document.getElementById('gameOver');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('muckSnakeHighScore') || 0;
        let gameRunning = true;
        let muckImage = null;

        highScoreDisplay.textContent = highScore;

        // Load muck image
        const img = new Image();
        img.src = 'media/muck.png';
        img.onload = function() {
            muckImage = img;
        };

        function update() {
            if (!gameRunning) return;

            direction = nextDirection;

            const head = snake[0];
            const newHead = {
                x: (head.x + direction.x + tileCount) % tileCount,
                y: (head.y + direction.y + tileCount) % tileCount
            };

            // Check collision with self
            for (let segment of snake) {
                if (newHead.x === segment.x && newHead.y === segment.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(newHead);

            // Check if ate food
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };

            // Make sure food doesn't spawn on snake
            for (let segment of snake) {
                if (food.x === segment.x && food.y === segment.y) {
                    generateFood();
                    return;
                }
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0f2010';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head - bright yellow
                    ctx.fillStyle = '#FFD700';
                } else {
                    // Body - light green
                    ctx.fillStyle = '#90EE90';
                }
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            // Draw food (muck.png or fallback)
            if (muckImage && muckImage.complete) {
                ctx.drawImage(
                    muckImage,
                    food.x * gridSize,
                    food.y * gridSize,
                    gridSize,
                    gridSize
                );
            } else {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(
                    food.x * gridSize + gridSize / 2,
                    food.y * gridSize + gridSize / 2,
                    gridSize / 2 - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }
        }

        function endGame() {
            gameRunning = false;
            gameOverDisplay.textContent = `GAME OVER! Final Score: ${score}`;
            gameOverDisplay.style.display = 'block';

            if (score > highScore) {
                highScore = score;
                highScoreDisplay.textContent = highScore;
                localStorage.setItem('muckSnakeHighScore', highScore);
                gameOverDisplay.textContent += ' 🏆 NEW HIGH SCORE!';
            }
        }

        function gameLoop() {
            update();
            draw();
            setTimeout(gameLoop, 100);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    e.preventDefault();
                    break;
                case ' ':
                    gameRunning = !gameRunning;
                    e.preventDefault();
                    break;
            }
        });

        gameLoop();
    </script>
</body>
</html>
